name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:test
      - run: bun test
      - run: bun run build
      - run: node scripts/startup-budget.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Publish to npm (OIDC, provenance)
        # No NODE_AUTH_TOKEN and no .npmrc auth line — either one disables OIDC.
        run: npm publish --access public
